<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Street Racer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#0d7d3a,#1aa14d)}
#road{position:absolute;left:9%;width:82%;height:100%;background:linear-gradient(90deg,#292929,#3b3b3b 50%,#292929);box-shadow:inset 0 0 0 4px #171717}
#road:before,#road:after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#eee;z-index:1}
#road:before{left:0}.road:after{right:0}
.line{position:absolute;top:-25%;height:23%;width:6px;background:#fff;opacity:.9;box-shadow:0 0 4px #fff}
.l1{left:33.3%}.l2{left:66.6%}
.car{position:absolute;width:14%;aspect-ratio:.55;border-radius:20% 20% 12% 12%;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.55)}
#player{background:linear-gradient(90deg,#d8d8d8,#fff,#c7c7c7);bottom:14%;left:43%;border:2px solid #111}
#player:before,.car:before{content:"";position:absolute;left:15%;right:15%;top:14%;height:29%;background:linear-gradient(#18222d,#050608);border-radius:30% 30% 18% 18%;border:1px solid #777}
#player:after,.car:after{content:"";position:absolute;left:11%;right:11%;bottom:8%;height:20%;background:#101010;border-radius:20%}
.car.red{background:linear-gradient(90deg,#8d1111,#ff3838,#9e1010)}
.car.blue{background:linear-gradient(90deg,#063c82,#1596ff,#06447f)}
.car.yellow{background:linear-gradient(90deg,#a66b00,#ffd329,#b87500)}
.car.green{background:linear-gradient(90deg,#075d2b,#1ac95c,#087137)}
.wheel{position:absolute;width:18%;height:25%;background:#080808;border-radius:50%;top:24%;z-index:-1}
.w1{left:-8%}.w2{right:-8%}.w3{left:-8%;bottom:22%;top:auto}.w4{right:-8%;bottom:22%;top:auto}
#enemy,#enemy2,#enemy3{display:none}
#coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4a0,#ffd21c 45%,#c88400);border:3px solid #fff5a5;z-index:4;box-shadow:0 0 15px #ffd83d;display:none}
#coin:after{content:"$";position:absolute;inset:0;text-align:center;color:#9a6500;font-weight:bold;line-height:24px;font-size:18px}
#hud{position:absolute;top:9px;left:3%;right:3%;z-index:10;display:flex;justify-content:space-between;gap:6px;color:#fff;font-weight:bold;text-shadow:0 2px 3px #000;font-size:16px}
.hudbox{background:rgba(0,0,0,.45);padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
#controls{position:absolute;bottom:4%;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:18%}
button{width:27vw;max-width:140px;height:70px;border:1px solid rgba(255,255,255,.25);border-radius:18px;background:rgba(0,0,0,.65);color:#fff;font-size:34px;font-weight:bold}
button:active{transform:scale(.96)}
#overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.88));color:#fff;text-align:center}
.panel{padding:25px;max-width:420px}
.logo{font-size:44px;font-weight:900;letter-spacing:2px;font-style:italic;color:#fff;text-shadow:3px 3px 0 #e51b23,0 0 18px rgba(255,40,40,.65);margin-bottom:4px}
.logoSmall{font-size:11px;letter-spacing:5px;color:#bbb;margin-bottom:20px}
p{font-size:18px;line-height:1.4}
#start{background:linear-gradient(#fff,#cfcfcf);color:#111;width:220px;height:58px;font-size:20px}
.hidden{display:none!important}
#levelUp{position:absolute;top:28%;left:0;right:0;text-align:center;color:#fff;font-size:28px;font-weight:bold;text-shadow:0 2px 8px #000;z-index:15;opacity:0;pointer-events:none}
.pop{animation:pop 1.2s ease}
@keyframes pop{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street Racer">
</head>
<body>
<div id="game">
  <div id="road"><div class="line l1"></div><div class="line l2"></div></div>

  <div id="player" class="car">
    <i class="wheel w1"></i><i class="wheel w2"></i><i class="wheel w3"></i><i class="wheel w4"></i>
  </div>

  <div id="enemy" class="car red"><i class="wheel w1"></i><i class="wheel w2"></i><i class="wheel w3"></i><i class="wheel w4"></i></div>
  <div id="enemy2" class="car blue"><i class="wheel w1"></i><i class="wheel w2"></i><i class="wheel w3"></i><i class="wheel w4"></i></div>
  <div id="enemy3" class="car yellow"><i class="wheel w1"></i><i class="wheel w2"></i><i class="wheel w3"></i><i class="wheel w4"></i></div>

  <div id="coin"></div>
  <div id="levelUp">LEVEL UP!</div>

  <div id="hud">
    <span class="hudbox">Score: <b id="score">0</b></span>
    <span class="hudbox">Coins: <b id="coins">0</b></span>
    <span class="hudbox">Level: <b id="level">1</b></span>
  </div>

  <div id="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>

  <div id="overlay">
    <div class="panel">
      <div class="logo">STREET RACER</div>
      <div class="logoSmall">CITY SPEED SERIES</div>
      <p id="message">Dodge traffic, collect coins and beat your high score.</p>
      <button id="start">START RACE</button>
      <p id="best"></p>
    </div>
  </div>
</div>

<script>
const player=document.getElementById('player');
const enemies=[document.getElementById('enemy'),document.getElementById('enemy2'),document.getElementById('enemy3')];
const coin=document.getElementById('coin');
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),levelEl=document.getElementById('level');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),bestEl=document.getElementById('best');
const message=document.getElementById('message'),levelUp=document.getElementById('levelUp');
const lines=[...document.querySelectorAll('.line')];

let running=false,score=0,coins=0,level=1,lane=1,speed=.7,last=0,raf=0;
let high=Number(localStorage.getItem('streetRacerHigh')||0);
let cars=[];
const lanePositions=[17,43,70];

bestEl.textContent='High Score: '+high;

function audio(){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(!window.gameAudio)window.gameAudio=new(window.AudioContext||window.webkitAudioContext)();
  if(window.gameAudio.state==='suspended')window.gameAudio.resume();
}
function beep(freq,duration,type='square',volume=.045){
  try{
    audio();const ctx=window.gameAudio,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(ctx.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.stop(ctx.currentTime+duration);
  }catch(e){}
}
function setLane(el,l){el.style.left=lanePositions[l]+'%'}
function resetEnemy(el){
  const c=cars.find(x=>x.el===el);
  const occupied=cars.filter(x=>x.active&&x.el!==el).map(x=>x.lane);
  const choices=[0,1,2].filter(x=>!occupied.includes(x));
  c.lane=choices.length?choices[Math.floor(Math.random()*choices.length)]:Math.floor(Math.random()*3);
  c.y=-28-Math.random()*35;c.active=true;
  setLane(el,c.lane);el.style.top=c.y+'%';el.style.display='block';
}
function spawnCoin(){
  coin.style.left=lanePositions[Math.floor(Math.random()*3)]+'%';
  coin.style.top=(-30-Math.random()*30)+'%';
  coin.style.display='block';
}
function startGame(){
  audio();score=0;coins=0;level=1;speed=.7;lane=1;last=performance.now();
  setLane(player,lane);
  cars=enemies.map((el,i)=>({el,lane:0,y:-40-i*50,active:false}));
  enemies.forEach(el=>el.style.display='none');
  resetEnemy(enemies[0]);spawnCoin();
  scoreEl.textContent=0;coinsEl.textContent=0;levelEl.textContent=1;
  overlay.querySelector('.logo').textContent='STREET RACER';
  message.textContent='Dodge traffic, collect coins and beat your high score.';
  startBtn.textContent='START RACE';overlay.classList.add('hidden');running=true;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
  beep(520,.08);setTimeout(()=>beep(720,.12),90);
}
function endGame(){
  running=false;
  if(score>high){high=score;localStorage.setItem('streetRacerHigh',high)}
  bestEl.textContent='High Score: '+high;
  overlay.querySelector('.logo').textContent='GAME OVER';
  message.textContent='Score: '+score+'   •   Coins: '+coins;
  startBtn.textContent='RACE AGAIN';overlay.classList.remove('hidden');
  beep(180,.25,'sawtooth',.06);
}
function move(dir){
  if(!running)return;
  lane=Math.max(0,Math.min(2,lane+dir));setLane(player,lane);
  beep(dir<0?330:390,.05,'square',.025);
}
function hit(a,b){
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
  return !(A.right<B.left+5||A.left>B.right-5||A.bottom<B.top+5||A.top>B.bottom-5);
}
function showLevelUp(){
  levelUp.textContent='LEVEL '+level;
  levelUp.classList.remove('pop');void levelUp.offsetWidth;levelUp.classList.add('pop');
  beep(700,.08);setTimeout(()=>beep(900,.1),90);
}
function updateTraffic(){
  if(level>=2&&!cars[1].active)resetEnemy(enemies[1]);
  if(level>=4&&!cars[2].active)resetEnemy(enemies[2]);
}
function loop(t){
  if(!running)return;
  const dt=Math.min(32,t-last);last=t;
  const roadMove=speed*dt*.04;

  lines.forEach((x,i)=>{
    let y=parseFloat(x.style.top||(-20+i*35));y+=roadMove;
    if(y>100)y=-25;x.style.top=y+'%';
  });

  cars.forEach((c)=>{
    if(!c.active)return;
    c.y+=speed*dt*.09;c.el.style.top=c.y+'%';
    if(hit(player,c.el)){endGame();return}
    if(c.y>110){
      c.active=false;c.el.style.display='none';score++;scoreEl.textContent=score;
      const newLevel=1+Math.floor(score/10);
      if(newLevel>level){
        level=newLevel;levelEl.textContent=level;speed=.7+level*.08;showLevelUp();updateTraffic();
      }
      resetEnemy(c.el);
    }
  });

  if(coin.style.display!=='none'){
    if(hit(player,coin)){
      coins++;score+=5;coinsEl.textContent=coins;scoreEl.textContent=score;
      coin.style.display='none';beep(850,.09,'sine',.06);
    }else if(parseFloat(coin.style.top)>110){spawnCoin()}
    coin.style.top=(parseFloat(coin.style.top)+speed*dt*.075)+'%';
    coin.style.transform='rotate('+((t/3)%360)+'deg)';
  }

  raf=requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);
  if(e.key==='Enter'&&!running)startGame();
});
['touchstart','mousedown'].forEach(evt=>{
  document.getElementById('left').addEventListener(evt,e=>{e.preventDefault();move(-1)});
  document.getElementById('right').addEventListener(evt,e=>{e.preventDefault();move(1)});
});
startBtn.addEventListener('click',startGame);

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
