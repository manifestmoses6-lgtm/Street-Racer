name: Build Street Racer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app.zip"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
            mkdir android-project
            unzip -o app.zip -d android-project
            find android-project -type d -name app -exec cp -r {} android-project/ \;
            cp build.gradle android-project/
            cp settings.gradle android-project/
            cp gradle.properties android-project/
    
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
         working-directory:android-project
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Street-Racer-APK
          path: android-project/StreetRacer/app/build/outputs/apk/debug/app-debug.apk
