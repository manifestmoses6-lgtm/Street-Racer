{
 "name": "Build Street Racer APK",
 "on": {
  "push": null,
  "workflow_dispatch": null
 },
 "jobs": {
  "build": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "name": "Checkout repository",
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Unzip project (if app.zip exists)",
     "run": "if [ -f app.zip ]; then\n mkdir -p android-project\n unzip -o app.zip -d android-project\nfi\n"
    },
    {
     "name": "Find project folder",
     "run": "S=$(find . -name settings.gradle -not -path \"./.git/*\" | head -1)\nif [ -z \"$S\" ]; then echo \"settings.gradle not found - upload app.zip or the project files\"; exit 1; fi\necho \"PROJECT_DIR=$(dirname \"$S\")\" >> $GITHUB_ENV\n"
    },
    {
     "name": "Set up Java",
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": 17
     }
    },
    {
     "name": "Set up Gradle",
     "uses": "gradle/actions/setup-gradle@v4",
     "with": {
      "gradle-version": 8.13
     }
    },
    {
     "name": "Build APK",
     "working-directory": "${{ env.PROJECT_DIR }}",
     "run": "gradle assembleDebug --no-daemon"
    },
    {
     "name": "Upload APK",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "StreetRacer-APK",
      "path": "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
     }
    }
   ]
  }
 }
}
