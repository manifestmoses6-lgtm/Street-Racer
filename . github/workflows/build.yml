name: Build Street Racer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if app.zip exists)
        run: |
          if [ -f app.zip ]; then
            mkdir -p android-project
            unzip -o app.zip -d android-project
          fi

      - name: Find project folder
        run: |
          S=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$S" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StreetRacer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
